content:
  - name: site
    label: Textos do site
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: pt
        label: Português
        component: languageContent
      - name: en
        label: English
        component: languageContent
      - name: es
        label: Español
        component: languageContent

settings:
  content:
    merge: true
