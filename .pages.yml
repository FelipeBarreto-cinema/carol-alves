
media:
  - name: flash
    label: Flashes
    input: public/flash
    output: /carol-alves/flash
    extensions: [jpg, jpeg, png, webp]

  - name: tattoo
    label: Fotos de tatuagens
    input: img/tattoo
    output: /img/tattoo
    extensions: [jpg, jpeg, png, webp]

